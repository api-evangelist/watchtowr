source: https://github.com/watchtowr/watchtowr-mcp
description: 'watchTowr publishes an official open-source MCP server (watchtowr/watchtowr-mcp, v0.1.2)
  that connects AI assistants to the watchTowr Platform Client API — attack surface assets, findings,
  hunts, certificates, suspicious domains, threat intel, plus composite intelligence tools (attack-surface
  summaries, change detection, executive scorecards, compliance reporting). Self-hosted: stdio for MCP
  clients or HTTP as a standalone service (Docker supported). Authenticates with a watchTowr Platform
  API key and per-tenant host; no hosted remote endpoint is published. Tool list extracted from the server
  source (fastmcp).'
server:
  name: watchtowr-mcp
  transport: stdio | http (self-hosted)
  install: git clone --recurse-submodules https://github.com/watchtowr/watchtowr-mcp.git && uv sync &&
    WATCHTOWR_API_KEY=... WATCHTOWR_PLATFORM_HOST=https://your-tenant.your-region.watchtowr.io uv run
    watchtowr-mcp
  docker: docker run -it --rm -e WATCHTOWR_API_KEY=... -e WATCHTOWR_PLATFORM_HOST=... watchtowr-mcp
  auth: apiKey (watchTowr Platform API key, per-tenant host)
  sdk: https://github.com/watchtowr/watchtowr-api-sdk-python (git submodule)
tool_count: 113
